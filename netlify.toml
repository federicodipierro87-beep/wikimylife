# ---------------------------------------------------------------------------
# Netlify serve file. Nient'altro.
#
# Niente Functions, niente Edge Functions, niente redirect proxy verso l'API:
# tutta la logica sta su Railway, e il browser parla con quel dominio usando
# `VITE_API_URL`. Un proxy `/api/* -> railway` sembrerebbe piu' comodo — stessa
# origine, zero CORS — e in cambio metterebbe l'hosting sul percorso di ogni
# chiamata: un timeout di Netlify diventerebbe un errore dell'API, e spostare il
# frontend altrove vorrebbe dire riscrivere questo file invece di cambiare una
# variabile.
#
# Il rovescio della medaglia e' che il CORS deve funzionare davvero, ed e' il
# motivo per cui `tests/integration/cors.e2e.test.ts` esiste.
# ---------------------------------------------------------------------------

[build]
  # La base e' la radice del monorepo: `apps/web` dipende da `packages/shared`
  # via symlink dei workspace, e da dentro `apps/web` quel symlink non esiste.
  base = "."
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify installa TUTTO il workspace, API e worker compresi, e il postinstall
  # di @prisma/client proverebbe a generare il client: qui non c'e' nessun
  # database, e non serve. Il frontend non importa Prisma nemmeno per sbaglio —
  # lo garantisce `tests/unit/guards.test.ts`.
  PRISMA_SKIP_POSTINSTALL_GENERATE = "true"

# --- Sicurezza --------------------------------------------------------------
# La CSP sta qui e non nell'API perche' protegge un documento, e il documento lo
# serve Netlify. Metterla sull'API sarebbe stato inutile e rassicurante insieme,
# che e' la combinazione peggiore.
#
# La build non contiene un solo script inline ne' uno stile inline — Vite mette
# tutto in file con hash, e nel codice non c'e' un `style={{...}}` — quindi
# 'unsafe-inline' non serve da nessuna parte. Va detto perche' e' fragile: il
# primo `<style>` aggiunto a index.html sparirebbe senza spiegazioni, e la
# spiegazione e' questa riga.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Un anno, sottodomini inclusi. Niente preload: iscriversi alla lista dei
    # browser e' difficile da revocare, e non si decide in un file di deploy.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Nessuna API di prossimita', e dirlo esplicitamente: il GPS lo chiede la
    # PWA per la posizione di cattura, il resto no.
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(self), payment=(), usb=()"

# `media-src blob:` non e' una concessione: il player scarica l'audio con
# `fetch` — perche' quell'URL vuole un header Authorization che un `src` non
# puo' portare — e poi lo passa a `<audio>` come object URL. Senza `blob:` la
# riproduzione si romperebbe e il motivo non comparirebbe da nessuna parte se
# non nella console.
#
# `connect-src https:` e non il dominio esatto dell'API: quel dominio cambia con
# il progetto Railway e inchiodarlo qui vorrebbe dire mettere una variabile
# d'ambiente dentro un file versionato. Resta comunque un limite vero — blocca
# `http:`, `data:` e `ws:` — ma chi ha un solo deploy fa bene a sostituirlo con
# l'origine precisa.

# --- Il service worker non si mette in cache --------------------------------
# Se la CDN tiene `sw.js` per un'ora, per un'ora il browser continua a
# reinstallare la versione vecchia: l'aggiornamento non arriva, e non c'e' modo
# di accorgersene guardando il deploy, che risulta riuscito.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Stessa ragione: l'HTML e' l'unico file che nomina gli asset con hash. Se resta
# in cache, resta in cache anche la versione precedente dell'app intera.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

# Gli asset invece hanno l'hash nel nome: un contenuto diverso ha un URL
# diverso, quindi tenerli per un anno non puo' servire niente di stantio.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- SPA --------------------------------------------------------------------
# Il router e' a frammento (`#/scheda/123`), e il frammento non arriva mai al
# server: per Netlify tutte le rotte sono `/`. Questo redirect serve comunque,
# perche' senza, un `/qualcosa` battuto a mano o un vecchio segnalibro
# darebbero il 404 di Netlify invece dell'app.
#
# Status 200 e non 301: l'URL nella barra resta quello chiesto, e il client
# decide cosa mostrare. Va per ultimo: Netlify prova prima i file veri, quindi
# `sw.js`, `manifest.webmanifest` e gli asset non ci finiscono dentro.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
