<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Due colori, uno per tema, uguali al `--bg` di styles.css: la barra del
      browser si fonde con la pagina invece di tagliarla. Chi non capisce il
      `media` prende il primo, e il primo e' il chiaro perche' e' il tema di
      partenza del foglio di stile.
    -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Racconta una volta come si fa. Ritrovalo per sempre."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icona.svg" type="image/svg+xml" />
    <!--
      iOS ignora il manifest per l'icona della schermata home, e questa deve
      essere un PNG, per quanto se ne sa: il perche' e il dubbio stanno in
      scripts/icone.ts, che la genera insieme a icona.svg.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `default` e non piu' `black-translucent`. Il secondo mette la pagina sotto
      l'orologio e scrive l'orologio sempre in bianco: col tema scuro era
      perfetto, col tema chiaro sarebbe bianco su bianco. Questo tiene la barra
      separata e leggibile nei due temi; il prezzo, non ancora misurato su un
      iPhone, e' che nell'app installata dalla Home la barra potrebbe restare
      chiara anche col tema scuro. Un difetto estetico contro uno di leggibilita'.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>WikiMyLife</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
